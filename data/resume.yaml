# Experience page content. The /experience/ page is rendered from this file by layouts/_default/resume.html.
# To add a job: copy a block under `positions` in any order. `end` (YYYY-MM, or 9999-12 for current) sorts them, most recent first.
# `when` is the date text people see; keep it in sync with `end`. and tag it with category ids from `categories`.
# `related` links accept any URL; /skills-applied/#<id> opens that project row on the Skills Applied page.

pdf: "/documents/resume.pdf"

categories:
  - id: education
    label: "Education"
  - id: data
    label: "Data & bioinformatics"
  - id: research
    label: "Research"
  - id: healthcare
    label: "Healthcare"
  - id: other
    label: "Other"

